<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grabadora - Glucena</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="js/lame.min.js"></script>
    <style>
        :root {
            color-scheme: dark;
            --bg-color: #0B0C10;
            --surface-color: #12141B;
            --input-bg: rgba(18, 20, 27, 0.95);
            --border-color: #1F2833;
            --text-color: #C5C6C7;
            --text-muted: #8892B0;
            --neon-blue: #66FCF1;
            --neon-dark: #45A29E;
            --danger: #FF3366;
            --success: #33FF66;
            --warning: #FFB800;
        }

        /* Dark scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(11, 12, 16, 0.8);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--neon-dark);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--neon-blue);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px 12px 40px 12px;
            overflow-x: hidden;
        }

        /* Header & Logo */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            text-align: center;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(102, 252, 241, 0.5);
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .logo {
            width: 110px;
            height: auto;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 16px rgba(102, 252, 241, 0.45));
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.04);
        }

        .badge-system {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            color: var(--neon-dark);
            background: rgba(69, 162, 158, 0.1);
            border: 1px solid rgba(69, 162, 158, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        /* Main Container */
        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(18, 20, 27, 0.85);
            border: 1px solid rgba(69, 162, 158, 0.3);
            border-radius: 16px;
            padding: 20px 18px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), 0 0 20px rgba(102, 252, 241, 0.1);
            backdrop-filter: blur(8px);
        }

        /* Sections */
        .section {
            margin-bottom: 24px;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--neon-blue);
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(69, 162, 158, 0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
        }

        /* Standardized Form Inputs & Placeholders */
        .form-group {
            margin-bottom: 14px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        label {
            display: block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--neon-blue);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-control {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--neon-dark);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 400;
            line-height: 1.4;
            transition: all 0.25s ease;
            outline: none;
            box-sizing: border-box;
        }

        /* Unified aesthetic placeholder style */
        .form-control::placeholder {
            color: rgba(197, 198, 199, 0.45);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 400;
            opacity: 1;
        }

        .form-control:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 12px rgba(102, 252, 241, 0.25);
            background-color: rgba(22, 26, 36, 1);
            color: #FFFFFF;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 85px;
            color-scheme: dark;
            scrollbar-color: var(--neon-dark) var(--input-bg);
            scrollbar-width: thin;
        }

        input[type="date"].form-control,
        input[type="time"].form-control {
            color-scheme: dark;
            cursor: pointer;
        }

        /* Buttons */
        .btn {
            background: transparent;
            border: 1.5px solid var(--neon-blue);
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            padding: 11px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
            letter-spacing: 1px;
            user-select: none;
        }

        .btn:hover:not(:disabled) {
            background: var(--neon-blue);
            color: var(--bg-color);
            box-shadow: 0 0 16px rgba(102, 252, 241, 0.6);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn.filled {
            background: rgba(102, 252, 241, 0.15);
            border-color: var(--neon-blue);
            color: var(--neon-blue);
        }

        .btn.ready {
            background: rgba(51, 255, 102, 0.15);
            border-color: var(--success);
            color: var(--success);
        }

        .btn.ready:hover:not(:disabled) {
            background: var(--success);
            color: var(--bg-color);
            box-shadow: 0 0 16px rgba(51, 255, 102, 0.6);
        }

        .btn.recording {
            border-color: var(--danger);
            color: #FFFFFF;
            background: rgba(255, 51, 102, 0.25);
            animation: pulse-danger 1.3s infinite;
        }

        @keyframes pulse-danger {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(255, 51, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0); }
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            border-color: #444;
            color: #777;
            box-shadow: none;
        }

        /* File Upload Wrappers */
        .file-upload-btn {
            position: relative;
            overflow: hidden;
            display: flex;
            cursor: pointer;
        }

        .file-upload-btn input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* Photo Preview */
        .photo-preview-container {
            position: relative;
            margin-top: 10px;
            display: none;
        }

        .photo-preview {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--neon-dark);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: block;
        }

        .btn-remove-photo {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(11, 12, 16, 0.85);
            border: 1px solid var(--danger);
            color: var(--danger);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
        }

        /* Audio Slot Cards */
        .slot-card {
            background: rgba(11, 12, 16, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            transition: border-color 0.25s ease;
        }

        .slot-card.has-audio {
            border-color: rgba(51, 255, 102, 0.4);
        }

        .slot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .slot-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--neon-blue);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-delete-slot {
            background: transparent;
            border: none;
            color: var(--danger);
            font-size: 0.75rem;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            padding: 2px 6px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .btn-delete-slot:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .slot-actions {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 8px;
        }

        .slot-actions .btn {
            padding: 10px 8px;
            font-size: 11.5px;
            margin-bottom: 0;
        }

        .audio-player {
            width: 100%;
            height: 36px;
            margin-top: 8px;
            display: none;
            border-radius: 6px;
            outline: none;
        }

        .audio-meta-tag {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 5px;
            display: none;
            word-break: break-all;
        }

        /* Add Track Button */
        .btn-add-track {
            border: 1.5px dashed var(--neon-dark);
            color: var(--neon-dark);
            font-size: 12px;
            padding: 10px;
            margin-top: 4px;
            margin-bottom: 8px;
        }

        .btn-add-track:hover {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            background: rgba(102, 252, 241, 0.05);
            box-shadow: 0 0 12px rgba(102, 252, 241, 0.2);
        }

        /* Summary Telemetry */
        .summary-bar {
            background: rgba(69, 162, 158, 0.08);
            border: 1px solid rgba(69, 162, 158, 0.25);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-bottom: 16px;
            font-family: 'Orbitron', sans-serif;
        }

        .summary-bar span {
            color: var(--neon-blue);
            font-weight: 700;
        }

        /* Submit Button */
        .btn-submit {
            background: linear-gradient(135deg, var(--neon-blue), #45A29E);
            color: #0B0C10;
            border: none;
            font-size: 1.05rem;
            font-weight: 900;
            padding: 15px;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(102, 252, 241, 0.4);
        }

        .btn-submit:hover:not(:disabled) {
            background: linear-gradient(135deg, #7DFDF4, #52B5B1);
            color: #000;
            box-shadow: 0 0 32px rgba(102, 252, 241, 0.75);
            transform: translateY(-1px);
        }

        /* Status & Feedback */
        .status-box {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            display: none;
            line-height: 1.4;
        }

        .status-box.success {
            display: block;
            background: rgba(51, 255, 102, 0.12);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .status-box.error {
            display: block;
            background: rgba(255, 51, 102, 0.12);
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        /* Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(11, 12, 16, 0.3);
            border-top: 2.5px solid #0B0C10;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Grabadora<br>Glucena</h1>
        <img src="logo.png" onerror="this.onerror=null; this.src='/logo.png';" alt="Glucena Logo" class="logo">
        <div class="badge-system">SISTEMA INTELIGENTE DE CAPTURA // MAKE</div>
    </header>

    <div class="container">
        
        <!-- 1. DATOS DE LA REUNIÓN (METADATOS SUPERIORES) -->
        <section class="section">
            <div class="section-title">
                <span>📋</span> 1. DATOS DE LA REUNIÓN
            </div>

            <!-- Título / Motivo de la Reunión -->
            <div class="form-group">
                <label for="meeting-title">📌 Título / Motivo de la Reunión</label>
                <input type="text" id="meeting-title" class="form-control" placeholder="Ej: Reunión Operativa CUSPAL / Revisión CxC / Junta Directiva">
            </div>

            <!-- Lugar -->
            <div class="form-group">
                <label for="meeting-place">📍 Lugar de la Reunión</label>
                <input type="text" id="meeting-place" class="form-control" placeholder="Ej: Sala de Juntas / Sede Central / Zoom">
            </div>

            <!-- Fecha y Hora -->
            <div class="form-group form-row">
                <div>
                    <label for="meeting-date">📅 Fecha (DD-MM-YYYY)</label>
                    <input type="date" id="meeting-date" class="form-control">
                </div>
                <div>
                    <label for="meeting-time">⏰ Hora (HH:mm)</label>
                    <input type="time" id="meeting-time" class="form-control">
                </div>
            </div>

            <!-- Asistentes -->
            <div class="form-group">
                <label for="meeting-attendees">👥 Asistentes (Uno por línea)</label>
                <textarea id="meeting-attendees" class="form-control" placeholder="Ej:&#10;Gonzalo Lucena&#10;Ing. Carlos Mendoza&#10;Lic. María Rodríguez"></textarea>
            </div>
        </section>

        <!-- 2. FOTO DE LA PIZARRA O MINUTA -->
        <section class="section">
            <div class="section-title">
                <span>📸</span> 2. FOTO DE LA PIZARRA / MINUTA
            </div>
            
            <div class="file-upload-btn btn" id="btn-photo">
                <span id="btn-photo-text">📷 TOMAR O SUBIR FOTO</span>
                <input type="file" id="photo-input" accept="image/*" capture="environment">
            </div>

            <div class="photo-preview-container" id="photo-preview-container">
                <button type="button" class="btn-remove-photo" onclick="removePhoto()">Quitar ✕</button>
                <img id="photo-preview" class="photo-preview" alt="Vista previa">
            </div>
        </section>

        <!-- 3. PISTAS DE AUDIO DINÁMICAS -->
        <section class="section">
            <div class="section-title">
                <span>🎙️</span> 3. GRABACIÓN / SUBIDA DE AUDIOS
            </div>

            <div id="slots-container">
                <!-- Se inyectan dinámicamente -->
            </div>

            <button type="button" class="btn btn-add-track" onclick="addAudioSlot()">
                ➕ AGREGAR OTRA PISTA DE AUDIO
            </button>
        </section>

        <!-- RESUMEN DE ELEMENTOS CARGADOS Y PESO -->
        <div class="summary-bar">
            <div>FOTO: <span id="telemetry-photo">NO</span></div>
            <div>PISTAS: <span id="telemetry-audios">0</span></div>
            <div>ASISTENTES: <span id="telemetry-attendees">0</span></div>
            <div>PESO: <span id="telemetry-size">0.0 MB</span> <small>(Máx 8MB Make)</small></div>
        </div>

        <!-- BOTÓN MAESTRO DE ENVÍO -->
        <button type="button" class="btn btn-submit" id="btn-submit" onclick="submitToMake()">
            <span id="submit-text">🚀 ENVIAR PAQUETE A MAKE</span>
            <div class="spinner" id="submit-spinner"></div>
        </button>

        <div id="status-box" class="status-box"></div>

    </div>

    <script>
        const MAKE_WEBHOOK_URL = "https://hook.eu2.make.com/bahndwb3u79hqcnjdvwbuy2pkwuddxo4";

        // Estado Global
        let photoFile = null;
        let slotCounter = 0;
        const slotsData = {}; // id -> { blob: Blob|null, file: File|null, mediaRecorder: null, chunks: [], isRecording: false, timerInterval: null, seconds: 0 }
        let currentRecordingSlotId = null;

        // Inicialización automática de Fecha y Hora al cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            initDateTimeDefaults();
            // Agregar 2 pistas iniciales por defecto
            addAudioSlot();
            addAudioSlot();
            updateTelemetry();

            // Escuchar cambios en asistentes para telemetría en vivo
            document.getElementById('meeting-attendees').addEventListener('input', updateTelemetry);
        });

        function initDateTimeDefaults() {
            const now = new Date();
            
            // Formato YYYY-MM-DD para el input type="date"
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            document.getElementById('meeting-date').value = `${year}-${month}-${day}`;

            // Formato HH:mm para el input type="time"
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('meeting-time').value = `${hours}:${minutes}`;
        }

        // Función de compresión automática de imágenes (reduce 4MB a ~200KB sin perder nitidez)
        function compressImage(file, maxWidth = 1600, quality = 0.75) {
            return new Promise((resolve) => {
                // Si el archivo ya es menor a 250KB, no necesita compresión
                if (file.size <= 250 * 1024) {
                    resolve(file);
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            if (!blob) {
                                resolve(file);
                                return;
                            }
                            const compressed = new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), {
                                type: 'image/jpeg',
                                lastModified: Date.now()
                            });
                            resolve(compressed);
                        }, 'image/jpeg', quality);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // Función de compresión automática de audio a MP3 optimizado para Whisper (reduce 25MB a ~4MB)
        async function compressAudio(file, onProgress) {
            // Si el archivo ya es menor a 1.5MB y es mp3 o webm, no necesita recodificación
            if (file.size <= 1.5 * 1024 * 1024 && (file.type.includes('mp3') || file.type.includes('webm') || file.name.toLowerCase().endsWith('.mp3'))) {
                return file;
            }

            try {
                if (typeof lamejs === 'undefined' || !lamejs.Mp3Encoder) {
                    console.warn("lamejs no disponible, manteniendo archivo original");
                    return file;
                }

                if (onProgress) onProgress("Decodificando...");

                const arrayBuffer = await file.arrayBuffer();
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContextClass();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                
                const duration = audioBuffer.duration; // en segundos
                if (onProgress) onProgress(`Remuestreando a 16kHz...`);

                // Resamplear a 16,000 Hz Mono (estándar nativo de OpenAI Whisper)
                const targetSampleRate = 16000;
                const offlineCtx = new OfflineAudioContext(1, Math.ceil(duration * targetSampleRate), targetSampleRate);
                const source = offlineCtx.createBufferSource();
                source.buffer = audioBuffer;
                source.connect(offlineCtx.destination);
                source.start(0);

                const resampledBuffer = await offlineCtx.startRendering();
                const channelData = resampledBuffer.getChannelData(0); // Float32Array

                // Convertir Float32Array (-1.0 a 1.0) a Int16Array (-32768 a 32767)
                const numSamples = channelData.length;
                const pcm16 = new Int16Array(numSamples);
                for (let i = 0; i < numSamples; i++) {
                    let s = Math.max(-1, Math.min(1, channelData[i]));
                    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }

                // Bitrate inteligente: si el audio supera 15 min (900s), usamos 24 kbps; si es más corto, 32 kbps
                const bitrate = duration > 900 ? 24 : 32;

                if (onProgress) onProgress(`Comprimiendo (${bitrate}k)...`);

                const encoder = new lamejs.Mp3Encoder(1, targetSampleRate, bitrate);
                const mp3Data = [];
                const sampleBlockSize = 1152;

                for (let i = 0; i < numSamples; i += sampleBlockSize) {
                    const chunk = pcm16.subarray(i, i + sampleBlockSize);
                    const mp3buf = encoder.encodeBuffer(chunk);
                    if (mp3buf.length > 0) {
                        mp3Data.push(mp3buf);
                    }
                }

                const flushBuf = encoder.flush();
                if (flushBuf.length > 0) {
                    mp3Data.push(flushBuf);
                }

                const mp3Blob = new Blob(mp3Data, { type: 'audio/mp3' });
                const cleanName = file.name.replace(/\.[^/.]+$/, "") + ".mp3";
                const compressedFile = new File([mp3Blob], cleanName, {
                    type: 'audio/mp3',
                    lastModified: Date.now()
                });

                return compressedFile;

            } catch (err) {
                console.error("Error al comprimir audio, usando archivo original:", err);
                return file;
            }
        }

        // Gestión de Foto
        document.getElementById('photo-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (file) {
                const btn = document.getElementById('btn-photo');
                document.getElementById('btn-photo-text').innerText = '⏳ Optimizando foto...';
                
                // Comprimir automáticamente
                const optimizedFile = await compressImage(file);
                photoFile = optimizedFile;

                const preview = document.getElementById('photo-preview');
                preview.src = URL.createObjectURL(optimizedFile);
                document.getElementById('photo-preview-container').style.display = 'block';
                
                btn.classList.add('ready');
                const kb = (optimizedFile.size / 1024).toFixed(0);
                document.getElementById('btn-photo-text').innerText = `✅ FOTO (${kb} KB)`;
                updateTelemetry();
            }
        });

        function removePhoto() {
            photoFile = null;
            document.getElementById('photo-input').value = "";
            document.getElementById('photo-preview').src = "";
            document.getElementById('photo-preview-container').style.display = 'none';
            
            const btn = document.getElementById('btn-photo');
            btn.classList.remove('ready');
            document.getElementById('btn-photo-text').innerText = '📷 TOMAR O SUBIR FOTO';
            updateTelemetry();
        }

        // Gestión Dinámica de Slots de Audio
        function addAudioSlot() {
            slotCounter++;
            const slotId = slotCounter;

            slotsData[slotId] = {
                blob: null,
                file: null,
                mediaRecorder: null,
                chunks: [],
                isRecording: false,
                timerInterval: null,
                seconds: 0
            };

            const container = document.getElementById('slots-container');
            const card = document.createElement('div');
            card.className = 'slot-card';
            card.id = `slot-card-${slotId}`;

            card.innerHTML = `
                <div class="slot-header">
                    <span class="slot-tag">
                        <span>🎵</span> PISTA ${slotId}
                    </span>
                    <button type="button" class="btn-delete-slot" onclick="deleteAudioSlot(${slotId})" title="Eliminar pista">
                        ✕ Quitar
                    </button>
                </div>

                <div class="slot-actions">
                    <!-- Opción 1: Grabar en vivo -->
                    <button type="button" class="btn" id="btn-rec-${slotId}" onclick="toggleRecord(${slotId})">
                        🎙️ Grabar
                    </button>

                    <!-- Opción 2: Subir archivo pregrabado -->
                    <div class="file-upload-btn btn" id="btn-upload-${slotId}">
                        <span id="btn-upload-text-${slotId}">📁 Subir Archivo</span>
                        <input type="file" accept="audio/*" onchange="handleAudioUpload(event, ${slotId})">
                    </div>
                </div>

                <!-- Reproductor de Audio -->
                <audio id="audio-player-${slotId}" class="audio-player" controls></audio>
                <div id="audio-meta-${slotId}" class="audio-meta-tag"></div>
            `;

            container.appendChild(card);
            updateTelemetry();
        }

        function deleteAudioSlot(slotId) {
            // No permitir eliminar si está grabando
            if (currentRecordingSlotId === slotId) {
                alert("Detén la grabación de esta pista antes de eliminarla.");
                return;
            }

            const card = document.getElementById(`slot-card-${slotId}`);
            if (card) {
                card.remove();
                delete slotsData[slotId];
                updateTelemetry();
            }
        }

        // Subida y compresión automática de archivo pregrabado
        async function handleAudioUpload(event, slotId) {
            const file = event.target.files[0];
            if (!file) return;

            const slot = slotsData[slotId];
            const card = document.getElementById(`slot-card-${slotId}`);
            card.classList.add('has-audio');

            const uploadBtn = document.getElementById(`btn-upload-${slotId}`);
            const uploadBtnText = document.getElementById(`btn-upload-text-${slotId}`);
            uploadBtn.classList.remove('ready');
            uploadBtn.style.opacity = '0.7';
            uploadBtnText.innerText = `⏳ Optimizando...`;

            // Resetear botón de grabación si estaba marcado
            const recBtn = document.getElementById(`btn-rec-${slotId}`);
            recBtn.classList.remove('ready');
            recBtn.innerText = '🎙️ Grabar';

            const originalMb = (file.size / (1024 * 1024)).toFixed(1);

            // Comprimir automáticamente a MP3 16kHz mono para Whisper
            const optimizedFile = await compressAudio(file, (msg) => {
                uploadBtnText.innerText = `⏳ ${msg.substring(0, 16)}...`;
            });

            slot.file = optimizedFile;
            slot.blob = null; // Priorizar archivo optimizado

            const optimizedMb = (optimizedFile.size / (1024 * 1024)).toFixed(1);
            uploadBtn.classList.add('ready');
            uploadBtn.style.opacity = '1';
            uploadBtnText.innerText = `✅ ${optimizedFile.name.substring(0, 12)}...`;

            // Mostrar en el reproductor
            const player = document.getElementById(`audio-player-${slotId}`);
            player.src = URL.createObjectURL(optimizedFile);
            player.style.display = 'block';

            const meta = document.getElementById(`audio-meta-${slotId}`);
            if (file.size !== optimizedFile.size) {
                meta.innerHTML = `Audio Optimizado: <strong>${optimizedFile.name}</strong><br><span style="color:var(--neon-blue);">Reducido: ${originalMb} MB ➔ ${optimizedMb} MB (-${Math.round((1 - optimizedFile.size/file.size)*100)}%)</span>`;
            } else {
                meta.innerText = `Archivo: ${optimizedFile.name} (${optimizedMb} MB)`;
            }
            meta.style.display = 'block';

            updateTelemetry();
        }

        // Grabación de Micrófono en vivo (Optimizada para Whisper y Make a 24kbps)
        async function toggleRecord(slotId) {
            const slot = slotsData[slotId];
            const btn = document.getElementById(`btn-rec-${slotId}`);

            // Si este slot ya está grabando -> Detener
            if (currentRecordingSlotId === slotId) {
                if (slot.mediaRecorder && slot.mediaRecorder.state !== 'inactive') {
                    slot.mediaRecorder.stop();
                }
                return;
            }

            // Si otro slot está grabando -> Avisar
            if (currentRecordingSlotId !== null) {
                alert(`Ya estás grabando activamente en la Pista ${currentRecordingSlotId}. Detenla primero.`);
                return;
            }

            // Iniciar Grabación con captura de voz mono optimizada
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        sampleRate: 16000,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                slot.chunks = [];
                slot.seconds = 0;
                slot.file = null; // Sobrescribir subida si graba

                // Seleccionar mimeType compatible
                let mimeType = 'audio/webm;codecs=opus';
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    if (MediaRecorder.isTypeSupported('audio/webm')) mimeType = 'audio/webm';
                    else if (MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
                    else if (MediaRecorder.isTypeSupported('audio/ogg')) mimeType = 'audio/ogg';
                }

                // Bitrate de 24 kbps para compresión máxima de voz (25 min = ~4.5 MB)
                try {
                    slot.mediaRecorder = new MediaRecorder(stream, {
                        mimeType: mimeType,
                        audioBitsPerSecond: 24000
                    });
                } catch (e) {
                    slot.mediaRecorder = new MediaRecorder(stream, { mimeType });
                }

                slot.mediaRecorder.ondataavailable = e => {
                    if (e.data && e.data.size > 0) {
                        slot.chunks.push(e.data);
                    }
                };

                slot.mediaRecorder.onstop = () => {
                    clearInterval(slot.timerInterval);
                    const audioBlob = new Blob(slot.chunks, { type: mimeType });
                    slot.blob = audioBlob;

                    // Detener micrófono para liberar hardware
                    stream.getTracks().forEach(track => track.stop());

                    currentRecordingSlotId = null;

                    // UI Actualizada
                    btn.classList.remove('recording');
                    btn.classList.add('ready');
                    btn.innerText = `✅ Grabado (${formatTime(slot.seconds)})`;

                    const card = document.getElementById(`slot-card-${slotId}`);
                    card.classList.add('has-audio');

                    // Reset botón de subida
                    const uploadBtn = document.getElementById(`btn-upload-${slotId}`);
                    uploadBtn.classList.remove('ready');
                    document.getElementById(`btn-upload-text-${slotId}`).innerText = '📁 Subir Archivo';

                    // Reproductor
                    const player = document.getElementById(`audio-player-${slotId}`);
                    player.src = URL.createObjectURL(audioBlob);
                    player.style.display = 'block';

                    const meta = document.getElementById(`audio-meta-${slotId}`);
                    meta.innerText = `Audio Grabado: ${formatTime(slot.seconds)} (${(audioBlob.size / 1024).toFixed(1)} KB)`;
                    meta.style.display = 'block';

                    updateTelemetry();
                };

                // Comenzar
                slot.mediaRecorder.start(250);
                currentRecordingSlotId = slotId;

                btn.classList.remove('ready');
                btn.classList.add('recording');
                btn.innerText = `🛑 Detener (00:00)`;

                // Cronómetro
                slot.timerInterval = setInterval(() => {
                    slot.seconds++;
                    btn.innerText = `🛑 Detener (${formatTime(slot.seconds)})`;
                }, 1000);

            } catch (err) {
                console.error("Error al acceder al micrófono:", err);
                alert("No se pudo acceder al micrófono. Por favor verifica los permisos del navegador.");
            }
        }

        function formatTime(totalSeconds) {
            const m = Math.floor(totalSeconds / 60);
            const s = totalSeconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // Telemetría en vivo
        function updateTelemetry() {
            document.getElementById('telemetry-photo').innerText = photoFile ? 'SÍ' : 'NO';
            
            let audioCount = 0;
            for (const id in slotsData) {
                if (slotsData[id].blob || slotsData[id].file) audioCount++;
            }
            document.getElementById('telemetry-audios').innerText = audioCount;

            const rawAttendees = document.getElementById('meeting-attendees').value.trim();
            const attendeesCount = rawAttendees ? rawAttendees.split('\n').filter(l => l.trim().length > 0).length : 0;
            document.getElementById('telemetry-attendees').innerText = attendeesCount;

            // Calcular peso total
            let totalBytes = 0;
            if (photoFile) totalBytes += photoFile.size;
            for (const id in slotsData) {
                if (slotsData[id].blob) totalBytes += slotsData[id].blob.size;
                if (slotsData[id].file) totalBytes += slotsData[id].file.size;
            }
            const mb = (totalBytes / (1024 * 1024)).toFixed(1);
            const sizeEl = document.getElementById('telemetry-size');
            if (sizeEl) {
                sizeEl.innerText = `${mb} MB`;
                if (totalBytes > 8.5 * 1024 * 1024) {
                    sizeEl.style.color = 'var(--danger)';
                    sizeEl.title = '⚠️ Excede el límite de 8MB de Make';
                } else {
                    sizeEl.style.color = 'var(--neon-blue)';
                    sizeEl.title = 'Dentro del límite aceptado';
                }
            }
        }

        // Envío Completo a Make Webhook
        async function submitToMake() {
            if (currentRecordingSlotId !== null) {
                alert("Tienes una grabación en curso. Por favor detenla antes de enviar.");
                return;
            }

            const title = document.getElementById('meeting-title') ? document.getElementById('meeting-title').value.trim() : "";
            const place = document.getElementById('meeting-place').value.trim();
            const rawDate = document.getElementById('meeting-date').value; // YYYY-MM-DD
            const time = document.getElementById('meeting-time').value; // HH:mm
            const attendees = document.getElementById('meeting-attendees').value.trim();

            // Convertir Fecha a formato estricto DD-MM-YYYY
            let formattedDate = "";
            if (rawDate) {
                const parts = rawDate.split('-');
                if (parts.length === 3) {
                    formattedDate = `${parts[2]}-${parts[1]}-${parts[0]}`;
                }
            }

            // Recolectar audios válidos y calcular peso total
            const validAudios = [];
            let totalSizeBytes = 0;
            if (photoFile) totalSizeBytes += photoFile.size;

            for (const id in slotsData) {
                const slot = slotsData[id];
                if (slot.blob) {
                    totalSizeBytes += slot.blob.size;
                    validAudios.push({
                        type: 'blob',
                        data: slot.blob,
                        name: `audio_pista_${id}.webm`
                    });
                } else if (slot.file) {
                    totalSizeBytes += slot.file.size;
                    validAudios.push({
                        type: 'file',
                        data: slot.file,
                        name: slot.file.name
                    });
                }
            }

            // Validación: al menos debe existir un insumo
            if (!photoFile && validAudios.length === 0 && !title && !place && !attendees) {
                alert("Ingresa al menos los datos de la reunión, una foto o una pista de audio antes de enviar.");
                return;
            }

            const btn = document.getElementById('btn-submit');
            const spinner = document.getElementById('submit-spinner');
            const submitText = document.getElementById('submit-text');
            const statusBox = document.getElementById('status-box');

            // GUARDIA DE TAMAÑO: Make Custom Webhook rechaza con 413 si supera 8.5MB
            const totalMb = (totalSizeBytes / (1024 * 1024)).toFixed(1);
            if (totalSizeBytes > 8.5 * 1024 * 1024) {
                statusBox.className = 'status-box error';
                statusBox.innerHTML = `
                    ⚠️ <strong>LÍMITE DE TAMAÑO DE MAKE EXCEDIDO:</strong><br><br>
                    El paquete total pesa <strong>${totalMb} MB</strong>.<br>
                    Los Webhooks de la plataforma Make tienen un límite estricto de máximo <strong>~8.5 MB</strong> por solicitud.<br><br>
                    <strong>Solución:</strong><br>
                    1. Graba audios cortos en el sitio (2 a 5 minutos) en lugar de un archivo único de 25 minutos.<br>
                    2. Para archivos pesados pregrabados (> 10MB), el flujo estándar es depositarlos en Google Drive para que Make los descargue por carpeta.
                `;
                statusBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            submitText.style.display = 'none';
            spinner.style.display = 'block';
            statusBox.className = 'status-box';
            statusBox.style.display = 'none';

            try {
                const formData = new FormData();
                
                // Metadatos de Reunión
                formData.append("origen", "MiniWeb Grabadora Glucena");
                formData.append("titulo", title);
                formData.append("nombre_reunion", title);
                formData.append("lugar", place);
                formData.append("lugar_reunion", place);
                formData.append("fecha", formattedDate);
                formData.append("hora", time);
                formData.append("asistentes", attendees);
                formData.append("total_audios", validAudios.length);

                // Foto (si existe)
                if (photoFile) {
                    formData.append("foto", photoFile, photoFile.name);
                }

                // Inyección de todas las pistas de audio
                validAudios.forEach((audio, idx) => {
                    const audioKey = `audio${idx + 1}`;
                    formData.append(audioKey, audio.data, audio.name);
                    // También agregar como array múltiple para Make
                    formData.append("audios[]", audio.data, audio.name);
                });

                const response = await fetch(MAKE_WEBHOOK_URL, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    statusBox.className = 'status-box success';
                    statusBox.innerHTML = `
                        🚀 <strong>¡Paquete enviado a Make con éxito!</strong><br>
                        Fecha: ${formattedDate} | Hora: ${time}<br>
                        Audios adjuntos: ${validAudios.length} (${totalMb} MB) | Foto: ${photoFile ? 'Adjunta' : 'No'}
                    `;
                    statusBox.style.display = 'block';

                    // Resetear formulario tras 4 segundos
                    setTimeout(() => {
                        window.location.reload();
                    }, 4000);

                } else {
                    throw new Error(`Servidor Make respondió con estado ${response.status}`);
                }

            } catch (err) {
                console.error("Error al enviar a Make:", err);
                statusBox.className = 'status-box error';
                let errMsg = err.message;
                if (errMsg.includes("Failed to fetch")) {
                    errMsg = `Conexión rechazada por Make (Gateway 413 o límite de red). Verifica que el paquete total no exceda 8.5 MB.`;
                }
                statusBox.innerHTML = `❌ <strong>Error al enviar:</strong> ${errMsg}`;
                statusBox.style.display = 'block';
                btn.disabled = false;
            } finally {
                submitText.style.display = 'inline';
                spinner.style.display = 'none';
            }
        }
    </script>
